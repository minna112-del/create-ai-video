<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Golapi Shop</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8f3;color:#321d26;font-family:system-ui,sans-serif;padding:24px;text-align:center}.card{max-width:360px}.logo{width:88px;height:88px;border-radius:24px;object-fit:cover}.muted{color:#765c66;line-height:1.6}button{border:0;border-radius:14px;background:#c92a5a;color:#fff;padding:13px 22px;font-weight:700}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="./icons/head_logo.webp" alt="Golapi Shop">
      <h1>Golapi Shop</h1>
      <p class="muted">লাইভ দোকান লোড করা যাচ্ছে না। ইন্টারনেট সংযোগ চালু করে আবার চেষ্টা করুন।<br>Unable to load the live store. Check your internet connection and try again.</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন / Retry</button>
    </main>
  </body>
</html>
