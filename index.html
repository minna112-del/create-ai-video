  <!-- Theme flash prevention -->
  <script>
    (function() {
      try {
        var mode =
          localStorage.getItem('golapi_theme') ||
          'auto';

        var resolved = mode;

        if (mode === 'auto') {
          resolved =
            window.matchMedia &&
            window
              .matchMedia(
                '(prefers-color-scheme: dark)'
              )
              .matches
              ? 'dark'
              : 'light';
        }

        document.documentElement.setAttribute(
          'data-theme',
          resolved
        );

        document.documentElement.setAttribute(
          'data-theme-mode',
          mode
        );
      } catch (e) {}
    })();
  </script>

  <!-- Firebase — ⚠️ ধীর/অস্থির নেটওয়ার্কে module script load-ই ব্যর্থ হতে পারে
       (গোটা Firebase SDK আসে gstatic.com CDN থেকে)। এটা ঘটলে 'firebase-ready'
       কখনো fire হয় না, পুরো প্রোডাক্ট লোডিং চিরতরে আটকে যায়। তাই স্ট্যাটিক
       <script> ট্যাগের বদলে dynamically তৈরি করে onerror-এ retry যোগ করা হলো। -->
  <script>
    (function loadFirebaseModule(attempt){
      const s = document.createElement('script');
      s.type = 'module';
      s.src = './js/firebase-init.js' + (attempt>0 ? '?retry='+attempt : '');
      s.onerror = function(){
        if(attempt < 3){
          setTimeout(()=>loadFirebaseModule(attempt+1), 2000 * (attempt+1));
        }
      };
      document.head.appendChild(s);
    })(0);
  </script>
