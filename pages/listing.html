<div class="page" id="page-listing">
  <section class="sec listing-page">
    <div class="crumb"><a href="#" onclick="Router.go('home')" data-bn="হোম" data-en="Home">হোম</a> &gt; <span id="listTitleCrumb" data-bn="সব পণ্য" data-en="All Products">সব পণ্য</span></div>
    <header class="listing-hero">
      <div>
        <span class="listing-kicker" data-bn="পণ্য দেখুন" data-en="Product Collection">পণ্য দেখুন</span>
        <h1 class="tiro" id="listTitle" data-bn="সব পণ্য" data-en="All Products">সব পণ্য</h1>
        <p id="listSubtitle">যা লাগবে খুঁজে কার্টে যোগ করুন।</p>
      </div>
      <button type="button" class="listing-list-cta" onclick="Router.go('custom-bazar')">
        <span class="ic ic-pencil" aria-hidden="true"></span>
        বাজারের তালিকা পাঠান
      </button>
    </header>
    <button id="mobFilterBtn" class="listing-mobile-filter" onclick="Listing.toggleMobile()" style="display:none" data-bn="<span><span class='ic ic-filter' aria-hidden='true'></span> ফিল্টার ও সর্ট</span><span>▾</span>" data-en="<span><span class='ic ic-filter' aria-hidden='true'></span> Filter &amp; Sort</span><span>▾</span>"><span><span class="ic ic-filter" aria-hidden="true"></span> ফিল্টার ও সর্ট</span><span>▾</span></button>
    <div class="listing-layout">
      <aside id="listingAside" aria-label="পণ্য ফিল্টার">
        <div class="filter-box"><h4 data-bn="মূল্য পরিসীমা" data-en="Price Range">মূল্য পরিসীমা</h4><input type="range" id="priceRange" min="0" max="10000" step="50" value="10000" oninput="document.getElementById('priceMaxLabel').textContent=(currentLang==='bn'?'৳'+bn(this.value):'৳'+this.value);Listing.render()" style="width:100%;accent-color:var(--gold)">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-muted)"><span data-bn="৳০" data-en="৳0">৳০</span><span id="priceMaxLabel" data-bn="৳১০,০০০" data-en="৳10,000">৳১০,০০০</span></div></div>
        <div class="filter-box"><h4 data-bn="ক্যাটাগরি" data-en="Category">ক্যাটাগরি</h4><div id="filterCategoryList"></div></div>
        <div class="filter-box"><h4 data-bn="অন্যান্য" data-en="Other">অন্যান্য</h4><label class="filter-opt"><input type="checkbox" id="filterCOD" onchange="Listing.render()"> <span data-bn="COD সুবিধা আছে" data-en="COD Available">COD সুবিধা আছে</span></label><label class="filter-opt"><input type="checkbox" id="filterInStock" onchange="Listing.render()"> <span data-bn="শুধু স্টকে আছে" data-en="In Stock Only">শুধু স্টকে আছে</span></label></div>
        <button class="btn btn-outline btn-block" style="font-size:12.5px;margin-top:6px" onclick="Listing.clearFilters()" data-bn="ফিল্টার রিসেট করুন" data-en="Reset Filters">ফিল্টার রিসেট করুন</button>
      </aside>
      <div>
        <div class="toolbar listing-toolbar"><span id="listCount"></span>
          <select id="sortSelect" class="field" style="width:auto;padding:8px 32px 8px 12px" onchange="Listing.render()">
            <option value="relevance" data-bn="প্রাসঙ্গিকতা" data-en="Relevance">প্রাসঙ্গিকতা</option><option value="price_asc" data-bn="মূল্য: কম→বেশি" data-en="Price: Low→High">মূল্য: কম→বেশি</option><option value="price_desc" data-bn="মূল্য: বেশি→কম" data-en="Price: High→Low">মূল্য: বেশি→কম</option><option value="newest" data-bn="নতুন প্রথমে" data-en="Newest First">নতুন প্রথমে</option><option value="rating" data-bn="সর্বোচ্চ রেটিং" data-en="Top Rated">সর্বোচ্চ রেটিং</option><option value="sold" data-bn="সর্বাধিক বিক্রি" data-en="Best Selling">সর্বাধিক বিক্রি</option>
          </select>
        </div>
        <div class="grid-row" id="listingGrid"></div>
      </div>
    </div>
  </section>
</div>
